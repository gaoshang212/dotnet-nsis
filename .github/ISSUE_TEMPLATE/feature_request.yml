name: Feature request
description: Suggest an improvement to dotnet-nsis.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Installer use case
      description: What are you trying to do, and what prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected CLI, YAML or installer behavior with an example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
