name: Bug report
description: Report a reproducible problem with dotnet-nsis.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, follow SECURITY.md instead of posting details here.
  - type: input
    id: version
    attributes:
      label: CLI version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Windows and .NET versions, application architecture, installer mode and installation scope.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include YAML, custom NSIS/JavaScript if relevant, and exact commands. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exit codes and relevant build.log or test output.
    validations:
      required: true
